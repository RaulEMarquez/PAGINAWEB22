<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Indica que utilizaremos caracteres especiales del español -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a celulares, tablets y computadoras -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Nombre que aparecerá en la pestaña del navegador -->
    <title>Página Web de 10DSM</title>

    <!-- Conecta nuestro archivo HTML con el archivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Conecta la página con el archivo Manifest de la PWA -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <!-- ENCABEZADO DE LA PÁGINA -->
    <header>

        <!-- Título principal de la página -->
        <h1>Página Web de 10DSM</h1>

        <!-- Texto de bienvenida -->
        <p>Bienvenidos a nuestra aplicación web progresiva</p>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- Sección de bienvenida -->
        <section class="tarjeta">

            <!-- Título de la sección -->
            <h2>Bienvenidos a 10DSM</h2>

            <!-- Descripción de la página -->
            <p>
                Esta es una página web sencilla desarrollada por 10DSM con
                HTML, CSS y JavaScript.
            </p>

            <!-- Botón que será utilizado por JavaScript -->
            <button id="boton">
                Haz clic aquí

            </button>
            <p id="mensaje"></p>

        </section>

    </main>
    <!-- PIE DE PÁGINA -->
    <footer>
        <p>2026 10DSM</p>

    </footer>

    <!-- Conecta el archivo JavaScript con nuestra página -->
    <script src="app.js"></script>

</body>

</html>
